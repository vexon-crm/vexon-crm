<style>
/* Макет: фиксированный сайдбар + верхняя панель + прокручиваемая рабочая область; на телефоне сайдбар становится выдвижным */
:root{

 --c1:#8b6cff;--c2:#4f8cff;--c3:#35c98b;--c4:#f2b24a;--c5:#f0607a;

 color-scheme:dark;
}

 --acc:#6d4cf0;--acc2:#2f6fe8;--accsoft:rgba(109,76,240,.1);--grad:linear-gradient(135deg,#6d4cf0,#2f6fe8);
 --ok:#12935f;--warn:#b7791f;--bad:#d1334f;--info:#2f6fe8;--shadow:0 8px 24px rgba(40,50,100,.1);
 --c1:#6d4cf0;--c2:#2f6fe8;--c3:#12935f;--c4:#d99016;--c5:#d1334f;color-scheme:light}}
:root[data-theme="light"]{
 --bg:#f3f4f9;--bg2:#eceef6;--card:#fff;--card2:#f6f7fc;--line:#e2e5f0;--fg:#171a29;--mut:#5d627a;--dim:#8d92a8;
 --acc:#6d4cf0;--acc2:#2f6fe8;--accsoft:rgba(109,76,240,.1);--grad:linear-gradient(135deg,#6d4cf0,#2f6fe8);
 --ok:#12935f;--warn:#b7791f;--bad:#d1334f;--info:#2f6fe8;--shadow:0 8px 24px rgba(40,50,100,.1);
 --c1:#6d4cf0;--c2:#2f6fe8;--c3:#12935f;--c4:#d99016;--c5:#d1334f;color-scheme:light}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--fg);font:14px/1.45 var(--fb);padding-left:0;padding-right:0;overflow:hidden}

.auth-box{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,460px);width:960px;max-width:100%;background:var(--card);border:1px solid var(--line);border-radius:24px;overflow:hidden;box-shadow:var(--shadow);animation:in .3s}

.auth-pitch h2{font-size:28px;line-height:1.15}.auth-pitch p{margin:0;opacity:.9}
.auth-pitch ul{margin:0;padding:0;list-style:none;display:flex;flex-direction:column;gap:10px}.auth-pitch li{display:flex;gap:10px}.auth-pitch li::before{content:"✓";font-weight:700}
.auth-form{padding:36px;display:flex;flex-direction:column;gap:14px;min-width:0}
.auth-form h2{font-size:22px}
.auth-form .fld input,.auth-form .fld select,.emprow input{width:100%;background:var(--bg2);border:1px solid var(--line);border-radius:11px;padding:10px 12px;outline:0}
.auth-form .fld input:focus,.emprow input:focus{border-color:var(--acc)}
.err{color:var(--bad);font-size:13px;min-height:18px}
.link{background:none;border:0;color:var(--acc);padding:0;text-decoration:underline;font-size:inherit}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{padding:6px 12px;border-radius:99px;border:1px solid var(--line);background:var(--card2);color:var(--mut)}
.chip.on{background:var(--accsoft);border-color:var(--acc);color:var(--fg)}
.steps{display:flex;gap:6px}.steps i{flex:1;height:4px;border-radius:9px;background:var(--line)}.steps i.on{background:var(--grad)}
.opt{display:flex;gap:12px;padding:14px;border:1px solid var(--line);border-radius:14px;background:var(--card2);text-align:left;width:100%;align-items:flex-start}
.opt.on{border-color:var(--acc);background:var(--accsoft)}.opt b{display:block;margin-bottom:2px}
.emprow{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px}
@media (max-width:760px){.auth{place-items:start center}.auth-box{grid-template-columns:1fr}.auth-pitch{padding:22px}.auth-pitch ul{display:none}.auth-form{padding:22px}.emprow{grid-template-columns:1fr}}
.wm{font:700 19px/1 'Unbounded',var(--fd);letter-spacing:.09em}
.wm i{font-style:normal;background:var(--grad);-webkit-background-clip:text;background-clip:text;color:transparent}
.auth-pitch .wm i{background:none;color:#fff;opacity:.65}
.auth-pitch .wm{font-size:22px}
.chrow{display:grid;grid-template-columns:auto 1fr auto;gap:12px;align-items:center;padding:12px 0;border-top:1px solid var(--line)}
.chrow:first-child{border-top:0}
.chrow input{min-width:0;background:var(--bg2);border:1px solid var(--line);border-radius:11px;padding:9px 12px;outline:0;width:100%}
.chrow input:focus{border-color:var(--acc)}
@media (max-width:560px){.chrow{grid-template-columns:auto 1fr}.chrow .btn{grid-column:1/-1;justify-content:center}}
/* Юридические документы и управление согласием */
.legal-links{display:flex;flex-wrap:wrap;gap:8px 14px;justify-content:center;font-size:12px;color:var(--mut);line-height:1.5}
.legal-links button,.legal-side button{border:0;background:none;color:var(--mut);padding:0;text-decoration:underline;text-underline-offset:3px}
.legal-links button:hover,.legal-side button:hover{color:var(--acc)}
.legal-check{display:flex;align-items:flex-start;gap:9px;font-size:12px;line-height:1.45;color:var(--mut)}
.legal-check input{margin:2px 0 0;flex:none;accent-color:var(--acc)}
.legal-check a{color:var(--acc);text-decoration:underline}
.legal-side{display:flex;flex-wrap:wrap;gap:7px 12px;padding:12px 8px 2px;font-size:11px}
.legal-overlay{position:fixed;inset:0;z-index:500;background:rgba(0,0,0,.68);display:grid;place-items:center;padding:16px}
.legal-dialog{width:min(820px,100%);max-height:88vh;overflow:auto;background:var(--card);color:var(--fg);border:1px solid var(--line);border-radius:18px;box-shadow:var(--shadow)}
.legal-head{position:sticky;top:0;display:flex;align-items:center;gap:12px;padding:16px 20px;background:var(--card);border-bottom:1px solid var(--line);z-index:1}
.legal-head h2{font-size:18px}.legal-head button{margin-left:auto;border:0;background:none;color:var(--mut);font-size:24px}
.legal-body{padding:20px;line-height:1.65;font-size:13px}.legal-body h3{font-size:15px;margin:18px 0 6px}.legal-body p{margin:7px 0}.legal-body ul{padding-left:20px}
.cookie-banner{position:fixed;z-index:600;left:16px;right:16px;bottom:18px;width:min(760px,calc(100% - 32px));margin:auto;padding:20px 22px;background:var(--card);color:var(--fg);border:1px solid var(--line);border-radius:18px;box-shadow:0 18px 60px rgba(0,0,0,.32);display:flex;gap:22px;align-items:center;justify-content:space-between;animation:in .22s ease-out}
.cookie-banner b{display:block;font-size:15px;margin-bottom:6px}.cookie-banner p{margin:0;color:var(--mut);font-size:12px;line-height:1.55}.cookie-actions{display:flex;gap:8px;align-items:center;flex-wrap:wrap;flex:none}.cookie-actions .btn{white-space:nowrap}
@media(max-width:640px){.cookie-banner{left:10px;right:10px;bottom:10px;width:calc(100% - 20px);display:block;padding:17px}.cookie-actions{margin-top:13px}.cookie-actions .btn{flex:1;justify-content:center}.legal-body{padding:16px}}
</style>

='1600'%20height='280'%20fill='url(%23f)'%20filter='url(%23c)'/%3E%3Cpath%20d='M0%20820Q300%20760%20600%20830T1200%20805T1600%20770V1000H0Z'%20fill='%230c1316'/%3E%3C/svg%3E") center/cover no-repeat}
input::placeholder,textarea::placeholder{color:var(--dim)}

.app{grid-template-columns:268px minmax(0,1fr);gap:16px;padding:16px}

.card,.col{background:var(--card);-webkit-backdrop-filter:blur(20px) saturate(1.3);backdrop-filter:blur(20px) saturate(1.3);border-color:var(--line);box-shadow:inset 0 1px 0 rgba(255,255,255,.09),var(--shadow)}

/* вход: крупный контурный логотип, матовая панель слева */
.auth{background:radial-gradient(1200px 700px at 18% 0,rgba(4,12,14,.08),rgba(4,10,12,.5)),linear-gradient(rgba(4,10,12,.22),rgba(4,10,12,.42))}

function nice(max){const p=Math.pow(10,Math.floor(Math.log10(max||1)));const m=max/p;return (m<=1?1:m<=2?2:m<=5?5:10)*p}
function axes(W,H,L,R,T,B,max,fmt,labels,step=1){
  let s='';const n=4;
  for(let i=0;i<=n;i++){const y=T+(H-T-B)*(1-i/n);s+=`<line x1="${L}" x2="${W-R}" y1="${y}" y2="${y}" style="stroke:var(--line)" stroke-dasharray="${i?'3 4':'0'}"/><text x="${L-8}" y="${y+4}" text-anchor="end">${fmt(max*i/n)}</text>`}
  return s;
}
function areaChart(vals,labels,{fmt=v=>v,color='--c1',unit=''}={}){
  const W=640,H=260,L=46,R=12,T=14,B=28,max=nice(Math.max(...vals)*1.05);
  const xs=i=>L+(W-L-R)*(vals.length==1?.5:i/(vals.length-1)),ys=v=>T+(H-T-B)*(1-v/max);
  const pts=vals.map((v,i)=>[xs(i),ys(v)]);
  const line=pts.map((p,i)=>(i?'L':'M')+p[0].toFixed(1)+' '+p[1].toFixed(1)).join(' ');
  const gid='g'+Math.random().toString(36).slice(2,7);
  const area=line+` L${xs(vals.length-1)} ${H-B} L${xs(0)} ${H-B}Z`;
  const step=Math.ceil(vals.length/8);
  return `<svg class="chart" viewBox="0 0 ${W} ${H}" role="img"><defs><linearGradient id="${gid}" x1="0" y1="0" x2="0" y2="1"><stop offset="0" style="stop-color:var(${color});stop-opacity:.35"/><stop offset="1" style="stop-color:var(${color});stop-opacity:0"/></linearGradient></defs>${axes(W,H,L,R,T,B,max,fmt)}<path d="${area}" fill="url(#${gid})"/><path d="${line}" fill="none" style="stroke:var(${color})" stroke-width="2.5" stroke-linejoin="round" stroke-linecap="round"/>${pts.map((p,i)=>`<circle cx="${p[0]}" cy="${p[1]}" r="${i==pts.length-1?5:3.5}" style="fill:var(--card);stroke:var(${color})" stroke-width="2"><title>${labels[i]}: ${fmt(vals[i])}${unit}</title></circle>`).join('')}${labels.map((l,i)=>i%step?'':`<text x="${xs(i)}" y="${H-8}" text-anchor="middle">${l}</text>`).join('')}</svg>`;
}
function barChart(series,labels,{fmt=v=>v,colors=['--c1','--c2','--c3']}={}){
  const W=640,H=260,L=46,R=12,T=14,B=28,all=series.flatMap(s=>s.v),max=nice(Math.max(...all)*1.05);
  const gw=(W-L-R)/labels.length,bw=Math.min(28,gw*.7/series.length);
  let s=axes(W,H,L,R,T,B,max,fmt);
  labels.forEach((l,i)=>{const cx=L+gw*(i+.5);s+=`<text x="${cx}" y="${H-8}" text-anchor="middle">${l}</text>`;
    series.forEach((sr,k)=>{const v=sr.v[i],h=(H-T-B)*v/max,x=cx-bw*series.length/2+k*bw;s+=`<rect x="${x+1}" y="${H-B-h}" width="${bw-2}" height="${Math.max(h,0)}" rx="4" style="fill:var(${colors[k]})"><title>${sr.n?sr.n+', ':''}${l}: ${fmt(v)}</title></rect>`})});
  return `<svg class="chart" viewBox="0 0 ${W} ${H}" role="img">${s}</svg>`;
}
function donut(data,total,{center=''}={}){
  const cols=['--c1','--c2','--c3','--c4','--c5','--c2'],sum=data.reduce((a,d)=>a+d[1],0);if(!sum)return '<div class="empty">Данных пока нет</div>';const R=70,r=46,cx=90,cy=90;let a0=-Math.PI/2,s='';
  data.forEach((d,i)=>{const a1=a0+Math.PI*2*d[1]/sum-.03,big=a1-a0>Math.PI?1:0;
    const p=(a,rr)=>[cx+rr*Math.cos(a),cy+rr*Math.sin(a)];const [x1,y1]=p(a0,R),[x2,y2]=p(a1,R),[x3,y3]=p(a1,r),[x4,y4]=p(a0,r);
    s+=`<path d="M${x1} ${y1}A${R} ${R} 0 ${big} 1 ${x2} ${y2}L${x3} ${y3}A${r} ${r} 0 ${big} 0 ${x4} ${y4}Z" style="fill:var(${cols[i%6]})"><title>${d[0]}: ${d[1]}</title></path>`;a0+=Math.PI*2*d[1]/sum});
  return `<div style="display:flex;gap:18px;align-items:center;flex-wrap:wrap"><svg class="chart" viewBox="0 0 180 180" style="width:170px;flex:none"><g>${s}</g><text x="90" y="88" text-anchor="middle" style="fill:var(--fg);font:600 22px var(--fd)">${sum}</text><text x="90" y="106" text-anchor="middle">${center||'всего'}</text></svg><div class="legend" style="flex-direction:column;gap:8px;margin:0">${data.map((d,i)=>`<span><i style="background:var(${cols[i%6]})"></i>${d[0]} · ${Math.round(d[1]/sum*100)}%</span>`).join('')}</div></div>`;
}

  if(!SOURCES.length)setList(SOURCES,SRC0);if(!CATS.length)setList(CATS,CAT0);if(!staff.length)staff.push(owner())}
function emptyWorkspace(){for(const k in LISTS){if(k==='SOURCES')setList(SOURCES,SRC0);else if(k==='CATS')setList(CATS,CAT0);else LISTS[k].length=0}nid=100;staff.push(owner())}
function recompute(){const y=String(TODAY.getFullYear());
  revenue.fill(0);dealCnt.fill(0);
  deals.forEach(d=>{if(d.created.slice(0,4)===y)dealCnt[+d.created.slice(5,7)-1]++;const c=d.closed||d.created;if(d.stage==='won'&&c.slice(0,4)===y)revenue[+c.slice(5,7)-1]+=d.sum/1e6});
  for(const k in srcData)delete srcData[k];clients.forEach(c=>srcData[c.source]=(srcData[c.source]||0)+1);
  staff.forEach(s=>{s.sales=deals.filter(d=>d.mgr===s.id&&d.stage==='won').reduce((a,d)=>a+d.sum,0)})}
const log=t=>{activity.unshift({mgr:1,t,ago:'только что',at:Date.now()});if(activity.length>40)activity.length=40};
const addHist=(cid,type,t)=>{if(cid)hist.push({cid,type,t,d:iso(0)})};
/* Сценарии автоматизации: реально срабатывают на события */
function fire(trig,ctx={}){autos.filter(a=>a.on&&a.trig===trig).forEach(a=>{a.runs=(a.runs||0)+1;const c=ctx.cid&&cliOf(ctx.cid);
  a.acts.forEach(x=>{
   if(x==='Создать задачу')tasks.push({id:++nid,title:a.name+(c?': '+c.name:''),desc:'Создано автоматически сценарием',mgr:ctx.mgr||(c&&c.mgr)||1,due:iso(1),prio:'Средний',status:'К выполнению',cid:ctx.cid||null,comments:[]});
   else if(x==='Уведомить руководителя')notifs.push({k:'n'+(++nid),t:`Сценарий «${a.name}»`+(ctx.what?': '+ctx.what:''),ago:'только что'});
   else if(x==='Изменить статус клиента'&&c)c.status='В работе';
   else if(x==='Назначить менеджера'&&c&&!staff.find(s=>s.id===c.mgr))c.mgr=1});
  log(`сработал сценарий «${a.name}»`)})}

   <div class="card"><h3>Ближайшие задачи<button class="btn sm" data-go="tasks">Все</button></h3><div class="list">${nextT.length?'':'<div class="empty">Открытых задач нет</div>'}${nextT.map(t=>`<div class="row"><button class="chk" data-act="tdone" data-id="${t.id}" aria-label="Выполнить"></button><div class="grow"><b>${esc(t.title)}</b><small>${t.due===iso(0)?'Сегодня':fd(t.due)} · ${esc(mgrOf(t.mgr).name)}</small></div>${ppill(t.prio)}</div>`).join('')}</div></div>
  </div>

  $('#ctb').innerHTML=l.length?l.map(c=>`<tr class="click" data-act="client" data-id="${c.id}"><td><span class="cell"><span class="av s" style="background:${COLORS[c.id%8]}">${ini(c.name)}</span><b style="font-weight:500">${esc(c.name)}</b></span></td><td>${esc(c.phone)}</td><td>${esc(c.email)}</td><td>${esc(c.company)}</td><td>${esc(c.source)}</td><td>${person(c.mgr)}</td><td>${fdf(c.added)}</td><td>${cpill(c.status)}</td><td><span class="cell"><button class="ibtn" style="width:32px;height:32px" data-act="editClient" data-id="${c.id}" aria-label="Изменить">${ico('edit')}</button><button class="ibtn" style="width:32px;height:32px" data-act="delClient" data-id="${c.id}" aria-label="Удалить">${ico('trash')}</button></span></td></tr>`).join(''):'<tr><td colspan="9"><div class="empty">Клиенты не найдены. Измените фильтры или добавьте нового.</div></td></tr>';

   info:()=>`<div class="form">${[['Телефон',c.phone],['Почта',c.email],['Компания',c.company],['Источник',c.source],['Менеджер',mgrOf(c.mgr).name],['Добавлен',fdf(c.added)]].map(x=>`<div class="fld"><label>${x[0]}</label><div>${esc(x[1])}</div></div>`).join('')}</div>`,
   hist:()=>{const h=hist.filter(x=>x.cid===id).sort((a,b)=>b.d.localeCompare(a.d));return h.length?`<div class="tl">${h.map(x=>`<div><b>${x.type}</b> · <span class="mut">${fd(x.d)}</span><br>${esc(x.t)}</div>`).join('')}</div>`:'<div class="empty">Взаимодействий пока нет</div>'},
   deals:()=>{const d=deals.filter(x=>x.cid===id);return d.length?`<div class="list">${d.map(x=>{const s=STAGES.find(y=>y.id===x.stage);return `<div class="row"><div class="grow"><b>${esc(x.title)}</b><small>${fd(x.created)}</small></div><b>${rub(x.sum)}</b><span class="pill" style="color:${s.c};background:color-mix(in srgb,${s.c} 16%,transparent)">${s.name}</span></div>`}).join('')}</div>`:'<div class="empty">Сделок нет</div>'},
   notes:()=>`<div class="list">${notes.filter(n=>n.cid===id).map(n=>`<div class="row">${av(n.a)}<div class="grow" style="white-space:normal"><b style="white-space:normal;font-weight:400">${esc(n.t)}</b><small>${esc(mgrOf(n.a).name)} · ${fd(n.d)}</small></div></div>`).join('')||'<div class="empty">Комментариев нет</div>'}</div><div class="tools" style="margin:14px 0 0"><input class="grow" id="nt" placeholder="Написать комментарий…"><button class="btn pri" id="nadd">Добавить</button></div>`,
   tasks:()=>{const t=tasks.filter(x=>x.cid===id);return t.length?`<div class="list">${t.map(x=>`<div class="row"><div class="grow"><b class="${x.status==='Выполнена'?'done':''}">${esc(x.title)}</b><small>до ${fd(x.due)} · ${esc(mgrOf(x.mgr).name)}</small></div>${ppill(x.prio)}</div>`).join('')}</div>`:'<div class="empty">Задач нет</div>'}
  };

  modal({title:`<span class="cell"><span class="av" style="background:${COLORS[c.id%8]}">${ini(c.name)}</span><span>${esc(c.name)}<br><small class="mut" style="font:400 12px var(--fb)">${esc(c.company)} · ${cpill(c.status)}</small></span></span>`,body:'',wide:1,
   foot:[{label:'Новая сделка',fn:()=>dealForm(null,id)},{label:'Изменить',fn:()=>clientForm(id)},{label:'Закрыть',cls:'pri',fn:closeModal}]});
  draw(tab);

function drawKan(){

  let dragId=null;

  $$('.col').forEach(col=>{col.ondragover=e=>{e.preventDefault();col.classList.add('over')};col.ondragleave=()=>col.classList.remove('over');
    col.ondrop=e=>{e.preventDefault();const id=+(e.dataTransfer.getData('text/plain')||dragId),d=deals.find(x=>x.id===id);if(d&&d.stage!==col.dataset.stage){setStage(d,col.dataset.stage);log(`перевёл(а) сделку «${d.title}» на этап «${STAGES.find(s=>s.id===d.stage).name}»`);toast(`«${d.title}» → ${STAGES.find(s=>s.id===d.stage).name}`);drawKan()}else col.classList.remove('over')}});

  if(was==='won'){const f=fin.find(f=>f.deal===d.id&&f.st==='Ожидается');if(f)fin.splice(fin.indexOf(f),1);delete d.closed}
  if(st==='lost')addHist(d.cid,'Сделка',`Сделка «${d.title}» проиграна`);

  }else{

    for(let i=0;i<cells;i++){const dn=i-lead+1,ok=dn>=1&&dn<=days,ds=ok?`${y}-${String(m+1).padStart(2,'0')}-${String(dn).padStart(2,'0')}`:'';

    $('#tbody').innerHTML=h+'</div>';
  }
}

 privacy:{title:'Политика конфиденциальности и обработки персональных данных',html:`
 <p><b>Дата редакции:</b> 12 ноября 2026 года.</p><p><b>Оператор:</b> [указать полное ФИО физического лица или наименование ИП/организации, адрес и контактный e-mail]. До заполнения этих сведений документ не готов к публикации.</p>
 <h3>1. Общие положения</h3><p>Настоящая Политика описывает обработку персональных данных при использовании сервиса alfa+ CRM (далее — Сервис). Оператор обрабатывает данные в соответствии с применимым законодательством РФ, включая Федеральный закон № 152-ФЗ «О персональных данных».</p><p>Политика относится к данным посетителей и зарегистрированных пользователей. Если пользователь вносит в CRM данные своих клиентов, сотрудников или иных лиц, пользователь самостоятельно определяет законное основание такой обработки и обязан информировать этих лиц. Оператор alfa+ обрабатывает такие сведения в рамках предоставления Сервиса и на условиях отдельного поручения/договора обработки, который должен быть оформлен до промышленного запуска.</p>
 <h3>2. Какие данные обрабатываются</h3><ul><li>Для регистрации и входа: имя, фамилия, номер телефона, адрес электронной почты, идентификатор аккаунта и технические данные аутентификации. Пароль передаётся сервису аутентификации и не должен сохраняться Оператором в открытом виде.</li><li>Для работы CRM: данные, которые пользователь самостоятельно вносит в рабочее пространство, включая сведения о клиентах, сделках, задачах, сотрудниках, товарах и коммуникациях. Пользователь должен вносить только данные, необходимые для его деловой цели.</li><li>Технические сведения: сведения о сессии, настройках интерфейса, событиях безопасности и журналов, если они формируются используемыми компонентами. Браузер также обращается к внешним ресурсам, используемым в коде (Google Fonts и CDN jsDelivr для библиотеки Supabase); их поставщики могут получать технические данные запроса, например IP-адрес и сведения о браузере.</li></ul><p>Не запрашиваются намеренно специальные категории персональных данных (например, сведения о здоровье, политических взглядах или интимной жизни), биометрические данные, паспортные данные и платёжные реквизиты. Не размещайте такие сведения в CRM, если для этого нет отдельного законного основания и согласованного процесса.</p>
 <h3>3. Цели и основания обработки</h3><ul><li>создание аккаунта, аутентификация и обеспечение доступа к Сервису;</li><li>предоставление функций CRM, сохранение рабочего пространства и синхронизация данных;</li><li>обеспечение безопасности, предотвращение злоупотреблений, диагностика ошибок и поддержка;</li><li>исполнение договора с пользователем и соблюдение обязательных требований закона.</li></ul><p>Основания: заключение и исполнение договора, обязанности по закону, а для тех операций, где это требуется, отдельное согласие субъекта персональных данных.</p>
 <h3>4. Действия с данными и минимизация</h3><p>Оператор может осуществлять сбор, запись, систематизацию, накопление, хранение, уточнение, использование, передачу уполномоченным обработчикам, блокирование и удаление данных. Состав данных ограничивается целями Сервиса. Пользователю не следует вносить избыточные сведения.</p>
 <h3>5. Хранение, обработчики и трансграничная передача</h3><p>В текущей версии Сервиса используется инфраструктура Supabase (аутентификация и облачное хранение рабочего пространства). Конкретное юридическое лицо-поставщик, регион размещения проекта, место первичного сбора и хранения данных, условия поручения обработки и наличие/отсутствие трансграничной передачи должны быть проверены и указаны Оператором до запуска для пользователей из РФ. Пока эти сведения не подтверждены, нельзя считать вопрос локализации и трансграничной передачи урегулированным.</p><p>Оператор не должен передавать данные третьим лицам, кроме привлечённых обработчиков, случаев, необходимых для работы Сервиса, исполнения закона или защиты прав. Список обработчиков и их роли подлежит заполнению после выбора инфраструктуры и интеграций.</p>
 <h3>6. Сроки хранения и удаление</h3><p>Данные хранятся не дольше, чем это необходимо для указанных целей, срока действия аккаунта и исполнения обязательных требований закона. После прекращения целей данные удаляются или обезличиваются, если их дальнейшее хранение не требуется законом. Конкретные сроки резервного копирования и удаления должны быть установлены в инфраструктуре и регламенте Оператора до запуска.</p>
 <h3>7. Права субъекта</h3><p>Субъект вправе запросить сведения об обработке, потребовать уточнения, блокирования или удаления данных, а также отозвать согласие, если обработка основана на согласии. Запрос направляется на [указать рабочий e-mail Оператора]. Отзыв согласия не влияет на законность обработки до его получения и не исключает обработку на иных законных основаниях.</p>
 <h3>8. Защита данных</h3><p>Оператор обязан принимать необходимые правовые, организационные и технические меры защиты. Фактические меры, ответственные лица, порядок реагирования на инциденты и уровень защищённости должны быть определены и документированы отдельно. Наличие этой Политики само по себе не подтверждает выполнение таких мер.</p>
 <h3>9. Контакты и изменения</h3><p>Контакт Оператора: [указать e-mail и почтовый адрес]. Политика может обновляться; актуальная редакция публикуется на странице Сервиса с датой изменения.</p>`},
 terms:{title:'Условия использования alfa+ CRM',html:`

function authMessage(e){
  const m=(e?.message||'').toLowerCase();
  if(m.includes('already registered')||m.includes('already been registered'))return 'Аккаунт с этой почтой уже существует. Попробуйте войти.';
  if(m.includes('invalid login credentials'))return 'Неверная почта или пароль.';
  if(m.includes('email not confirmed'))return 'Сначала подтвердите почту по ссылке из письма.';
  if(m.includes('password'))return 'Пароль должен содержать не менее 6 символов.';
  return e?.message||'Не удалось выполнить запрос. Проверьте соединение и настройки Supabase.';
}

  $('#meBtn').onclick=e=>{e.stopPropagation();const p=$('#mePop');p.hidden=!p.hidden};
  $('#gs').oninput=e=>gsearch(e.target.value);$('#gs').onfocus=e=>gsearch(e.target.value);
  $('#rfile').onchange=e=>{const f=e.target.files[0];if(!f)return;const r=new FileReader();r.onload=()=>{try{const o=JSON.parse(r.result);if(!o.lists)throw 0;const lg=ME.login,em=ME.email;restore(r.result);resetME({...ME,login:lg,onboarded:true});flush();paintShell();drawNav();toast('Данные восстановлены');go('home')}catch(x){toast('Файл не похож на резервную копию alfa+')}};r.readAsText(f);e.target.value=''};
  window.addEventListener('hashchange',()=>{const h=location.hash.slice(1);if(h&&h!==cur&&!$('#app').hidden)go(h)});
  ['home','analytics','staff','finance'].forEach(k=>{const f=V[k];V[k]=()=>{recompute();f()}});
  window.addEventListener('pagehide',flush);
  setTheme(theme);
  try{const {data,error}=await sb.auth.getSession();if(error)throw error;if(data.session?.user)openSession(data.session.user);else showAuth('login')}catch(e){showAuth('login','Не удалось подключиться к Supabase: '+authMessage(e))}
}
init();
</script>

</body></html>
